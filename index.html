                if (typeof text !== 'string') return text;
                try {
                    return JSON.parse(text);

                    const startObj = text.indexOf('{');
                    const startArr = text.indexOf('[');
                    let start = -1;
                    let end = -1;
                    
                    if (startObj !== -1 && (startArr === -1 || startObj < startArr)) {
                        start = startObj;
                        end = text.lastIndexOf('}');
                    } else if (startArr !== -1) {
                        start = startArr;

                    if (start !== -1 && end !== -1 && end > start) {

                    }

                    requestPool.push({ url: `https://allorigins.hexschool.workers.dev/raw?url=${encodeURIComponent(baseUrl)}`, type: 'Hexschool Cloudflare' });
                    requestPool.push({ url: `https://api.allorigins.win/get?url=${encodeURIComponent(baseUrl)}`, type: 'AllOrigins Wrapped' });
                    requestPool.push({ url: `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(baseUrl)}`, type: 'CodeTabs' });
                });

                let resolved = false;
                let activeRequests = requestPool.length;
                const controllers = [];

                const cleanLoadingAndTransition = (data) => {
                    if (resolved) return;
                    resolved = true;
                    
                    controllers.forEach(ctrl => {
                        try { ctrl.abort(); } catch(e) {}
                    });

                    try {
                        sessionStorage.setItem(cleanQuery, JSON.stringify(data));
                    } catch (e) {}

                    setSearchResult(data);
                    setCurrentPage('result');
                    setLoading(false);
                };

                const handleFailure = () => {
                    activeRequests--;
                    if (activeRequests === 0 && !resolved) {
                        setLoading(false);
                        showMsg("DATA TIDAK DITEMUKAN / TIMEOUT");
                    }
                };

                requestPool.forEach((targetObj) => {
                    const ctrl = new AbortController();
                    controllers.push(ctrl);
                    const id = setTimeout(() => ctrl.abort(), 8000); 

                    try {
                        fetch(targetObj.url, { signal: ctrl.signal })
                            .then(async (res) => {
                                clearTimeout(id);
                                if (resolved) return;
                                if (!res.ok) { handleFailure(); return; }
                                
                                const text = await res.text();
                                const vehicleData = unifyAndExtractVehicleData(text);
                                
                                if (vehicleData && !resolved) {
                                    cleanLoadingAndTransition(vehicleData);
                                } else {
                                    handleFailure();
                                }
                            })
                            .catch((err) => {
                                clearTimeout(id);
                                handleFailure();
                            });
                    } catch (err) {
                        clearTimeout(id);
                        handleFailure();
                    }
                });
            };
